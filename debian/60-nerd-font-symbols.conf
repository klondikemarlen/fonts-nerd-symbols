<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The upstream aliases add Symbols Nerd Font with weak binding. Language
       matching can then prefer unrelated PUA glyphs in fonts such as UnDotum.
       Append strong fallbacks without displacing the requested text family. -->
  <match target="pattern">
    <test name="family" qual="any" compare="contains">
      <string>Symbols Nerd Font</string>
    </test>
    <edit name="family" mode="append_last" binding="strong">
      <string>Symbols Nerd Font</string>
      <string>FontAwesome</string>
      <string>Material Design Icons version 6</string>
      <string>Material Design Icons version 5</string>
    </edit>
  </match>
</fontconfig>
